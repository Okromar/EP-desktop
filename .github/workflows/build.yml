name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate default app icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 512, 512
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(0, 85, 165))
          $bmp.Save("app-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          npx tauri icon app-icon.png
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ePerso-EPHEC-Windows11
          path: src-tauri/target/release/eperso-desktop.exe
