<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPHEC Desktop — Accueil</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --surface: #111827;
      --surface-hover: #172033;
      --border: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(59, 130, 246, 0.55);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-orange: #ea580c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.16), transparent 42%),
        radial-gradient(circle at 85% 85%, rgba(234, 88, 12, 0.12), transparent 42%),
        var(--bg-dark);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .launcher {
      width: 100%;
      max-width: 720px;
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
      color: #fff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .brand-text h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .date-pill {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .auto-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(37, 99, 235, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 12px;
      padding: 11px 16px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .auto-banner.visible {
      display: flex;
    }

    .auto-banner button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .auto-banner button:hover {
      background: #334155;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    .portal-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      text-align: left;
      color: var(--text-main);
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-family: inherit;
    }

    .portal-card:hover {
      transform: translateY(-3px);
      background: var(--surface-hover);
      border-color: var(--border-hover);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }

    .portal-card.moodle:hover {
      border-color: rgba(234, 88, 12, 0.6);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-box.eperso {
      background: rgba(37, 99, 235, 0.16);
      color: #60a5fa;
    }

    .icon-box.moodle {
      background: rgba(234, 88, 12, 0.16);
      color: #fb923c;
    }

    .kbd-hint {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .card-cta {
      margin-top: auto;
      font-size: 0.8rem;
      font-weight: 600;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .portal-card.moodle .card-cta {
      color: #fb923c;
    }

    .quick-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .quick-link {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      transition: all 0.15s ease;
    }

    .quick-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: #cbd5e1;
    }

    .remember-label input {
      accent-color: var(--accent-blue);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .reset-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
    }

    .reset-btn:hover {
      color: #f8fafc;
    }

    @media (max-width: 640px) {
      .main-grid { grid-template-columns: 1fr; }
      .quick-links { grid-template-columns: 1fr 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="launcher">
    <div class="header">
      <div class="brand">
        <div class="brand-badge">EP</div>
        <div class="brand-text">
          <h1>EPHEC Desktop</h1>
          <p>Sélectionne ton environnement de travail</p>
        </div>
      </div>
      <div class="date-pill" id="todayLabel"></div>
    </div>

    <div class="auto-banner" id="autoBanner">
      <span id="autoBannerText">Ouverture automatique dans 2s...</span>
      <button type="button" id="cancelAutoBtn">Annuler</button>
    </div>

    <div class="main-grid">
      <button type="button" class="portal-card eperso" id="btnEperso">
        <div class="card-top">
          <div class="icon-box eperso">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <span class="kbd-hint">Touche 1</span>
        </div>
        <div>
          <div class="card-title">ePerso</div>
          <div class="card-desc">Consultation des horaires, résultats d'examens, occupation des locaux et documents administratifs.</div>
        </div>
        <div class="card-cta">Ouvrir ePerso →</div>
      </button>

      <button type="button" class="portal-card moodle" id="btnMoodle">
        <div class="card-top">
          <div class="icon-box moodle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <span class="kbd-hint">Touche 2</span>
        </div>
        <div>
          <div class="card-title">Moodle</div>
          <div class="card-desc">Accès aux supports de cours, dépôts de travaux, annonces des professeurs et tests en ligne.</div>
        </div>
        <div class="card-cta">Ouvrir Moodle →</div>
      </button>
    </div>

    <div class="quick-section-title">Accès direct</div>
    <div class="quick-links">
      <a class="quick-link" href="https://eperso.ephec.be/HeHoraire/HoraireV2">Horaires</a>
      <a class="quick-link" href="https://eperso.ephec.be/HeResultat/Resultat">Résultats</a>
      <a class="quick-link" href="https://eperso.ephec.be/HeOccupationLocaux/OccupationLocaux">Locaux libres</a>
      <a class="quick-link" href="https://moodle.ephec.be/my/courses.php">Mes cours</a>
    </div>

    <div class="footer">
      <label class="remember-label">
        <input type="checkbox" id="rememberCheck" />
        <span>Mémoriser ce choix au démarrage</span>
      </label>
      <button type="button" class="reset-btn" id="resetPrefBtn" style="display:none;">
        Effacer le choix mémorisé
      </button>
    </div>
  </div>

  <script>
    const URL_EPERSO = "https://eperso.ephec.be/";
    const URL_MOODLE = "https://moodle.ephec.be/my/index.php";
    const STORAGE_KEY = "ephec_startup_url";

    const todayEl = document.getElementById("todayLabel");
    todayEl.textContent = new Date().toLocaleDateString("fr-FR", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    const rememberCheck = document.getElementById("rememberCheck");
    const resetPrefBtn = document.getElementById("resetPrefBtn");
    const autoBanner = document.getElementById("autoBanner");
    const autoBannerText = document.getElementById("autoBannerText");
    const cancelAutoBtn = document.getElementById("cancelAutoBtn");

    const savedUrl = localStorage.getItem(STORAGE_KEY);
    const skipAuto = new URLSearchParams(window.location.search).get("picker") === "1";
    let autoTimer = null;

    if (savedUrl) {
      rememberCheck.checked = true;
      resetPrefBtn.style.display = "inline";

      if (!skipAuto) {
        const label = savedUrl.includes("moodle") ? "Moodle" : "ePerso";
        let seconds = 2;
        autoBanner.classList.add("visible");
        autoBannerText.textContent = `Ouverture automatique de ${label} dans ${seconds}s...`;

        autoTimer = setInterval(() => {
          seconds -= 1;
          if (seconds <= 0) {
            clearInterval(autoTimer);
            window.location.href = savedUrl;
          } else {
            autoBannerText.textContent = `Ouverture automatique de ${label} dans ${seconds}s...`;
          }
        }, 1000);
      }
    }

    cancelAutoBtn.addEventListener("click", () => {
      if (autoTimer) clearInterval(autoTimer);
      autoBanner.classList.remove("visible");
    });

    function openPortal(url) {
      if (autoTimer) clearInterval(autoTimer);
      if (rememberCheck.checked) {
        localStorage.setItem(STORAGE_KEY, url);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
      window.location.href = url;
    }

    document.getElementById("btnEperso").addEventListener("click", () => openPortal(URL_EPERSO));
    document.getElementById("btnMoodle").addEventListener("click", () => openPortal(URL_MOODLE));

    resetPrefBtn.addEventListener("click", () => {
      if (autoTimer) clearInterval(autoTimer);
      localStorage.removeItem(STORAGE_KEY);
      rememberCheck.checked = false;
      resetPrefBtn.style.display = "none";
      autoBanner.classList.remove("visible");
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "1") openPortal(URL_EPERSO);
      if (e.key === "2") openPortal(URL_MOODLE);
    });
  </script>
</body>
</html>
