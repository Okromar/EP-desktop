<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPHEC Desktop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 8px 0; font-size: 1.4rem; }
    p { margin: 0 0 22px 0; color: #94a3b8; font-size: 0.9rem; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #2563eb; border-color: #2563eb; }
  </style>
</head>
<body>
  <div class="box">
    <h1>EPHEC Desktop</h1>
    <p>Choisis l'espace à ouvrir :</p>
    <div class="btns">
      <button type="button" onclick="location.href='https://eperso.ephec.be/'">ePerso</button>
      <button type="button" onclick="location.href='https://moodle.ephec.be/my/index.php'">Moodle</button>
    </div>
  </div>
</body>
</html>
