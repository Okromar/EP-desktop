<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPHEC — Espace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #f7f7f5;
      color: #161616;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 680px;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid #161616;
      margin-bottom: 36px;
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #161616;
    }

    .title-group p {
      font-size: 0.85rem;
      color: #666662;
      margin-top: 4px;
    }

    .meta-right {
      text-align: right;
      font-size: 0.78rem;
      color: #666662;
      font-variant-numeric: tabular-nums;
    }

    .ascii-mark {
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: 0.72rem;
      line-height: 1.15;
      color: #8c8c86;
      margin-bottom: 4px;
      user-select: none;
    }

    .auto-notice {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid #161616;
      padding: 10px 14px;
      margin-bottom: 24px;
      font-size: 0.82rem;
    }

    .auto-notice.active {
      display: flex;
    }

    .auto-notice button {
      background: none;
      border: 1px solid #161616;
      color: #161616;
      padding: 4px 10px;
      font-size: 0.76rem;
      cursor: pointer;
      font-family: inherit;
    }

    .auto-notice button:hover {
      background: #161616;
      color: #f7f7f5;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .choice {
      background: #ffffff;
      border: 1px solid #e2e2dd;
      padding: 24px;
      text-align: left;
      cursor: pointer;
      color: #161616;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 164px;
      transition: border-color 0.14s ease, transform 0.14s ease;
    }

    .choice:hover {
      border-color: #161616;
      transform: translateY(-2px);
    }

    .choice-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .choice-index {
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: 0.75rem;
      color: #777772;
    }

    .choice-name {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .choice-desc {
      font-size: 0.83rem;
      color: #666662;
      line-height: 1.45;
    }

    .choice-arrow {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #161616;
      font-weight: 500;
    }

    .shortcuts-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #777772;
      margin-bottom: 10px;
    }

    .shortcuts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }

    .shortcut {
      background: #ffffff;
      border: 1px solid #e2e2dd;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: #161616;
      text-decoration: none;
      transition: border-color 0.14s ease, background-color 0.14s ease;
    }

    .shortcut:hover {
      border-color: #161616;
      background-color: #efefec;
    }

    .bottom-bar {
      padding-top: 16px;
      border-top: 1px solid #e2e2dd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #666662;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: #161616;
    }

    .remember input {
      accent-color: #161616;
      cursor: pointer;
    }

    .reset-btn {
      background: none;
      border: none;
      color: #666662;
      font-size: 0.78rem;
      text-decoration: underline;
      cursor: pointer;
      font-family: inherit;
    }

    .reset-btn:hover {
      color: #161616;
    }

    @media (max-width: 580px) {
      .choices { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; gap: 10px; }
      .meta-right { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="title-group">
        <h1>EPHEC</h1>
        <p>Choisir un espace de travail</p>
      </div>
      <div class="meta-right">
        <div class="ascii-mark" aria-hidden="true">[ ephec // desktop ]</div>
        <div id="dateText"></div>
      </div>
    </header>

    <div class="auto-notice" id="autoNotice">
      <span id="autoNoticeText"></span>
      <button type="button" id="cancelAuto">Annuler</button>
    </div>

    <section class="choices">
      <button type="button" class="choice" id="goEperso">
        <div>
          <div class="choice-head">
            <span class="choice-index">01</span>
            <span class="choice-index">[1]</span>
          </div>
          <div class="choice-name">ePerso</div>
          <div class="choice-desc">Horaires, résultats, occupation des locaux et documents.</div>
        </div>
        <div class="choice-arrow">Ouvrir →</div>
      </button>

      <button type="button" class="choice" id="goMoodle">
        <div>
          <div class="choice-head">
            <span class="choice-index">02</span>
            <span class="choice-index">[2]</span>
          </div>
          <div class="choice-name">Moodle</div>
          <div class="choice-desc">Cours, dépôts de travaux, annonces et ressources.</div>
        </div>
        <div class="choice-arrow">Ouvrir →</div>
      </button>
    </section>

    <div class="shortcuts-label">Accès direct</div>
    <nav class="shortcuts">
      <a class="shortcut" href="https://eperso.ephec.be/HeHoraire/HoraireV2">Horaires</a>
      <a class="shortcut" href="https://eperso.ephec.be/HeResultat/Resultat">Résultats</a>
      <a class="shortcut" href="https://eperso.ephec.be/HeOccupationLocaux/OccupationLocaux">Locaux libres</a>
      <a class="shortcut" href="https://moodle.ephec.be/my/courses.php">Mes cours</a>
    </nav>

    <footer class="bottom-bar">
      <label class="remember">
        <input type="checkbox" id="rememberPref" />
        <span>Mémoriser ce choix au démarrage</span>
      </label>
      <button type="button" class="reset-btn" id="clearPref" style="display:none;">
        Réinitialiser
      </button>
    </footer>
  </main>

  <script>
    const URL_EPERSO = "https://eperso.ephec.be/";
    const URL_MOODLE = "https://moodle.ephec.be/my/index.php";
    const PREF_KEY = "ephec_startup_url";

    document.getElementById("dateText").textContent = new Date().toLocaleDateString("fr-FR", {
      weekday: "short",
      day: "numeric",
      month: "short"
    });

    const rememberPref = document.getElementById("rememberPref");
    const clearPref = document.getElementById("clearPref");
    const autoNotice = document.getElementById("autoNotice");
    const autoNoticeText = document.getElementById("autoNoticeText");
    const cancelAuto = document.getElementById("cancelAuto");

    const saved = localStorage.getItem(PREF_KEY);
    const skipAuto = new URLSearchParams(window.location.search).get("picker") === "1";
    let timer = null;

    if (saved) {
      rememberPref.checked = true;
      clearPref.style.display = "inline";

      if (!skipAuto) {
        const targetName = saved.includes("moodle") ? "Moodle" : "ePerso";
        let left = 2;
        autoNotice.classList.add("active");
        autoNoticeText.textContent = `Ouverture de ${targetName} dans ${left}s…`;

        timer = setInterval(() => {
          left -= 1;
          if (left <= 0) {
            clearInterval(timer);
            window.location.href = saved;
          } else {
            autoNoticeText.textContent = `Ouverture de ${targetName} dans ${left}s…`;
          }
        }, 1000);
      }
    }

    cancelAuto.addEventListener("click", () => {
      if (timer) clearInterval(timer);
      autoNotice.classList.remove("active");
    });

    function navigateTo(url) {
      if (timer) clearInterval(timer);
      if (rememberPref.checked) {
        localStorage.setItem(PREF_KEY, url);
      } else {
        localStorage.removeItem(PREF_KEY);
      }
      window.location.href = url;
    }

    document.getElementById("goEperso").addEventListener("click", () => navigateTo(URL_EPERSO));
    document.getElementById("goMoodle").addEventListener("click", () => navigateTo(URL_MOODLE));

    clearPref.addEventListener("click", () => {
      if (timer) clearInterval(timer);
      localStorage.removeItem(PREF_KEY);
      rememberPref.checked = false;
      clearPref.style.display = "none";
      autoNotice.classList.remove("active");
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "1") navigateTo(URL_EPERSO);
      if (e.key === "2") navigateTo(URL_MOODLE);
    });
  </script>
</body>
</html>
